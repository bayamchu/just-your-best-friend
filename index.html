<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Your Best Friend</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;background:#090909;color:#f5f5f5;
  font-family:Arial,sans-serif;padding:24px
}
.card{
  width:100%;max-width:390px;text-align:center;
  padding:38px 24px;border:1px solid #343434;
  background:#111;border-radius:18px
}
.lock{font-size:27px;margin-bottom:25px}
h1{font-size:27px;letter-spacing:3px;line-height:1.5;margin:0}
.subtitle{color:#999;font-size:13px;letter-spacing:1px;margin:12px 0 34px}
.label{color:#bbb;font-size:13px;margin-bottom:17px}
.pin{display:flex;justify-content:center;gap:12px;margin-bottom:25px}
.pin input{
  width:43px;height:49px;background:#1b1b1b;color:white;
  border:1px solid #555;border-radius:8px;text-align:center;
  font-size:22px;outline:none
}
.pin input:focus{border-color:#ddd}
button{
  width:100%;padding:14px;background:#eee;color:#111;
  border:0;border-radius:8px;font-weight:bold;letter-spacing:2px
}
#message{min-height:20px;color:#f19b9b;font-size:13px;margin-top:15px}
#story{display:none;margin-top:28px;color:#ddd;line-height:1.8}
.small{color:#777;font-size:11px;margin-top:30px}
</style>
</head>
<body>
<main class="card">
  <div class="lock">🔒</div>
  <h1>JUST YOUR<br>BEST FRIEND</h1>
  <p class="subtitle">some feelings are better left unspoken</p>
  <p class="label">MASUKKAN PIN UNTUK MEMBACA CERITA</p>
  <div class="pin">
    <input aria-label="Digit 1" inputmode="numeric" maxlength="1">
    <input aria-label="Digit 2" inputmode="numeric" maxlength="1">
    <input aria-label="Digit 3" inputmode="numeric" maxlength="1">
    <input aria-label="Digit 4" inputmode="numeric" maxlength="1">
  </div>
  <button id="unlock">UNLOCK</button>
  <p id="message" role="status"></p>
  <section id="story">
    <h2>Welcome to the story</h2>
    <p>JUST YOUR BEST FRIEND</p>
    <p>Aksa × Aluna</p>
    <p>Some feelings are never spoken.</p>
  </section>
  <p class="small">A STORY BY YOU</p>
</main>
<script>
const inputs=[...document.querySelectorAll('.pin input')];
inputs.forEach((input,i)=>{
  input.addEventListener('input',()=>{
    input.value=input.value.replace(/\D/g,'').slice(-1);
    if(input.value && i<inputs.length-1)inputs[i+1].focus();
  });
  input.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&!input.value&&i>0)inputs[i-1].focus();
  });
});
document.getElementById('unlock').addEventListener('click',()=>{
  const pin=inputs.map(input=>input.value).join('');
  const message=document.getElementById('message');
  if(pin==='2905'){
    message.textContent='';
    document.getElementById('story').style.display='block';
  }else{
    message.textContent='PIN salah, coba lagi ya';
    document.getElementById('story').style.display='none';
  }
});
</script>
</body>
</html>
